<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title data-dil="menu.title">PANİK BUTONU</title>
<!-- Ikon oyunun kendi paletiyle cizildi (bkz. #1a1c2c theme-color).
     32x32 PNG: modern tarayicilarin hepsi kabul ediyor, .ico gerekmiyor. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<!-- Ana ekrana eklendiginde tam ekran ve YATAY acilsin: oyun 16:9,
     telefonun yatay hali de oyle. Dikeyde tuval ekranin %24"unu,
     yatayda %69"unu kapliyor (olculdu). -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panik Butonu">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ------- ANA MENÜ ------- -->
  <!-- Tek parca, tam ekran dama zemini: butun ekranlarin arkasinda ayni
       desen akar, boylece bolge sinirlarinda kayma olmaz. -->
  <div class="dama" aria-hidden="true"></div>

  <!-- Ust cubuk her iki ekranin da ustunde durur: TAM EKRAN ve ses dugmesi
       menude de, oyunda da ayni yerde olsun. CIK ise sadece odadayken gorunur. -->
  <div id="topbar">
    <button id="btnLeave" class="mini danger hidden" data-dil="ust.cik">&#8592; ÇIK</button>
    <!-- Dil dugmesi: TR ve EN arasinda gidip gelir. Secim localStorage'da
         saklanir, sunucuya gonderilmez - herkes kendi dilini gorur. -->
    <button id="btnLang" class="mini" data-dil-al="ust.dilEtiket" aria-label="Dil / Language">TR</button>
    <button id="btnFull" class="mini" data-dil="ust.tamEkran">TAM EKRAN</button>
    <button id="btnMute" class="mini simge" data-dil-al="ust.sesKapat" aria-label="Sesi kapat" title="Ses açık"></button>
  </div>

  <div id="menu" class="screen">
    <h1><span data-dil="menu.baslik1">PANİK</span><span data-dil="menu.baslik2">BUTONU</span></h1>
    <p class="tag" data-dil="menu.slogan">2-4 kişilik mini oyun düellosu</p>

    <input id="name" maxlength="10" placeholder="ADIN" data-dil-ph="menu.adin" autocomplete="off" spellcheck="false">

    <button id="btnQuick" class="mbtn quick" data-dil="menu.hizli">HIZLI OYNA</button>
    <p class="quickhint" data-dil="menu.hizliIpucu">rastgele biriyle eşleş</p>

    <div class="sep"><span data-dil="menu.veya">VEYA ARKADAŞINLA</span></div>

    <button id="btnCreate" class="mbtn primary" data-dil="menu.odaKur">ODA KUR</button>

    <div class="joinrow">
      <input id="code" maxlength="4" placeholder="KOD" data-dil-ph="menu.kod" autocomplete="off" spellcheck="false">
      <button id="btnJoin" class="mbtn" data-dil="menu.katil">KATIL</button>
    </div>

    <p id="menuErr"></p>

    <p class="help">
      <span class="klavye">
        <span data-dil="menu.kontroller">Kontroller:</span>
        <b data-dil="menu.bosluk">BOŞLUK</b> <span data-dil="menu.bas">= bas</span>
        &nbsp;·&nbsp;
        <b data-dil="menu.yonTuslari">YÖN TUŞLARI</b> <span data-dil="menu.hareket">= hareket</span><br>
      </span>
      <span data-dil="menu.telefonIpucu">Telefonda ekrandaki butonları kullan.</span>
    </p>
  </div>

  <!-- ------- OYUN ------- -->
  <div id="game" class="screen hidden">
    <!-- Lobide oyun alaninin yanina sohbet paneli acilir; mac baslayinca
         kapanir ve oyun alani tekrar buyur. Dar ekranda alta iner. -->
    <div id="arena">
      <div id="stage">
        <canvas id="cv" width="320" height="180"></canvas>
      </div>

      <aside id="chat" class="hidden">
        <div id="chatLog" role="log" aria-live="polite" data-dil-al="sohbet.baslik" aria-label="Sohbet"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatMsg" maxlength="120" placeholder="Mesaj yaz..." data-dil-ph="sohbet.yaz" data-dil-al="sohbet.mesaj" aria-label="Mesaj">
          <button type="submit" class="mini" data-dil="sohbet.gonder">GÖNDER</button>
        </form>
      </aside>
    </div>

    <!-- Dikey telefonda tuval ekranin %24"unu, yatayda %69"unu kapliyor.
         Bu yuzden ipucu var; ama dikeyde de oynanabildigi icin
         ENGELLEMIYOR, sadece bir seritle haber veriyor. -->
    <div id="cevir" aria-hidden="true" data-dil="cevir.ipucu">TELEFONU YAN ÇEVİR — OYUN 3 KAT BÜYÜR</div>

    <div id="pad" data-scheme="none">
      <div class="grp" data-for="action">
        <button class="pbtn big" data-k="action" data-dil="pad.bas">BAS</button>
      </div>

      <div class="grp" data-for="lobby">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn big" data-k="action" data-dil="pad.bas">BAS</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp" data-for="lr">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp dpad" data-for="dpad">
        <button class="pbtn" data-k="up">&#9650;</button>
        <div class="row">
          <button class="pbtn" data-k="left">&#9664;</button>
          <button class="pbtn" data-k="right">&#9654;</button>
        </div>
        <button class="pbtn" data-k="down">&#9660;</button>
      </div>
    </div>
  </div>

</div>

<script src="js/dil.js"></script>
<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/chars.js"></script>
<script src="js/sound.js"></script>
<script src="js/net.js"></script>
<script src="js/input.js"></script>
<script src="js/minigames/race.js"></script>
<script src="js/minigames/reflex.js"></script>
<script src="js/minigames/dodge.js"></script>
<script src="js/minigames/memory.js"></script>
<script src="js/minigames/mole.js"></script>
<script src="js/minigames/hotpotato.js"></script>
<script src="js/minigames/filedelete.js"></script>
<script src="js/minigames/wirecut.js"></script>
<script src="js/minigames/shapesort.js"></script>
<script src="js/minigames/puzzle.js"></script>
<script src="js/minigames/floor.js"></script>
<script src="js/minigames/collect.js"></script>
<script src="js/minigames/tersemir.js"></script>
<script src="js/main.js"></script>
</body>
</html>
