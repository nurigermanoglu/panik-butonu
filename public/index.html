<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title>PARTİ PANİK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ------- ANA MENÜ ------- -->
  <div id="menu" class="screen">
    <h1>PARTİ<span>PANİK</span></h1>
    <p class="tag">2-4 kişilik mini oyun düellosu</p>

    <input id="name" maxlength="10" placeholder="ADIN" autocomplete="off" spellcheck="false">

    <button id="btnQuick" class="mbtn quick">HIZLI OYNA</button>
    <p class="quickhint">rastgele biriyle eşleş</p>

    <div class="sep"><span>VEYA ARKADAŞINLA</span></div>

    <button id="btnCreate" class="mbtn primary">ODA KUR</button>

    <div class="joinrow">
      <input id="code" maxlength="4" placeholder="KOD" autocomplete="off" spellcheck="false">
      <button id="btnJoin" class="mbtn">KATIL</button>
    </div>

    <p id="menuErr"></p>

    <p class="help">
      Kontroller: <b>BOŞLUK</b> = bas &nbsp;·&nbsp; <b>YÖN TUŞLARI</b> = hareket<br>
      Telefonda ekrandaki butonları kullan.
    </p>
  </div>

  <!-- ------- OYUN ------- -->
  <div id="game" class="screen hidden">
    <div id="topbar">
      <div id="share" class="hidden">
        <span class="lbl">LİNK:</span>
        <span id="shareUrl"></span>
        <button id="btnCopy" class="mini">KOPYALA</button>
      </div>
      <button id="btnFull" class="mini">TAM EKRAN</button>
      <button id="btnMute" class="mini">SES: AÇIK</button>
    </div>

    <div id="stage">
      <canvas id="cv" width="320" height="180"></canvas>
    </div>

    <div id="pad" data-scheme="none">
      <div class="grp" data-for="action">
        <button class="pbtn big" data-k="action">BAS</button>
      </div>

      <div class="grp" data-for="lobby">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn big" data-k="action">BAS</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp" data-for="lr">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp dpad" data-for="dpad">
        <button class="pbtn" data-k="up">&#9650;</button>
        <div class="row">
          <button class="pbtn" data-k="left">&#9664;</button>
          <button class="pbtn" data-k="right">&#9654;</button>
        </div>
        <button class="pbtn" data-k="down">&#9660;</button>
      </div>
    </div>
  </div>

</div>

<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/chars.js"></script>
<script src="js/sound.js"></script>
<script src="js/net.js"></script>
<script src="js/input.js"></script>
<script src="js/minigames/race.js"></script>
<script src="js/minigames/reflex.js"></script>
<script src="js/minigames/dodge.js"></script>
<script src="js/minigames/memory.js"></script>
<script src="js/minigames/mole.js"></script>
<script src="js/minigames/hotpotato.js"></script>
<script src="js/minigames/filedelete.js"></script>
<script src="js/minigames/wirecut.js"></script>
<script src="js/minigames/shapesort.js"></script>
<script src="js/minigames/puzzle.js"></script>
<script src="js/main.js"></script>
</body>
</html>
