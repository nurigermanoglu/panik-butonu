<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title>PARTİ PANİK</title>
<!-- Ikon oyunun kendi paletiyle cizildi (bkz. #1a1c2c theme-color).
     32x32 PNG: modern tarayicilarin hepsi kabul ediyor, .ico gerekmiyor. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ------- ANA MENÜ ------- -->
  <!-- Tek parca, tam ekran dama zemini: butun ekranlarin arkasinda ayni
       desen akar, boylece bolge sinirlarinda kayma olmaz. -->
  <div class="dama" aria-hidden="true"></div>

  <!-- Ust cubuk her iki ekranin da ustunde durur: TAM EKRAN ve ses dugmesi
       menude de, oyunda da ayni yerde olsun. CIK ise sadece odadayken gorunur. -->
  <div id="topbar">
    <button id="btnLeave" class="mini danger hidden">&#8592; ÇIK</button>
    <button id="btnFull" class="mini">TAM EKRAN</button>
    <button id="btnMute" class="mini simge" aria-label="Sesi kapat" title="Ses açık"></button>
  </div>

  <div id="menu" class="screen">
    <h1>PARTİ<span>PANİK</span></h1>
    <p class="tag">2-4 kişilik mini oyun düellosu</p>

    <input id="name" maxlength="10" placeholder="ADIN" autocomplete="off" spellcheck="false">

    <button id="btnQuick" class="mbtn quick">HIZLI OYNA</button>
    <p class="quickhint">rastgele biriyle eşleş</p>

    <div class="sep"><span>VEYA ARKADAŞINLA</span></div>

    <button id="btnCreate" class="mbtn primary">ODA KUR</button>

    <div class="joinrow">
      <input id="code" maxlength="4" placeholder="KOD" autocomplete="off" spellcheck="false">
      <button id="btnJoin" class="mbtn">KATIL</button>
    </div>

    <p id="menuErr"></p>

    <p class="help">
      Kontroller: <b>BOŞLUK</b> = bas &nbsp;·&nbsp; <b>YÖN TUŞLARI</b> = hareket<br>
      Telefonda ekrandaki butonları kullan.
    </p>
  </div>

  <!-- ------- OYUN ------- -->
  <div id="game" class="screen hidden">
    <!-- Lobide oyun alaninin yanina sohbet paneli acilir; mac baslayinca
         kapanir ve oyun alani tekrar buyur. Dar ekranda alta iner. -->
    <div id="arena">
      <div id="stage">
        <canvas id="cv" width="320" height="180"></canvas>
      </div>

      <aside id="chat" class="hidden">
        <div id="chatLog" role="log" aria-live="polite" aria-label="Sohbet"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatMsg" maxlength="120" placeholder="Mesaj yaz..." aria-label="Mesaj">
          <button type="submit" class="mini">GÖNDER</button>
        </form>
      </aside>
    </div>

    <div id="pad" data-scheme="none">
      <div class="grp" data-for="action">
        <button class="pbtn big" data-k="action">BAS</button>
      </div>

      <div class="grp" data-for="lobby">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn big" data-k="action">BAS</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp" data-for="lr">
        <button class="pbtn" data-k="left">&#9664;</button>
        <button class="pbtn" data-k="right">&#9654;</button>
      </div>

      <div class="grp dpad" data-for="dpad">
        <button class="pbtn" data-k="up">&#9650;</button>
        <div class="row">
          <button class="pbtn" data-k="left">&#9664;</button>
          <button class="pbtn" data-k="right">&#9654;</button>
        </div>
        <button class="pbtn" data-k="down">&#9660;</button>
      </div>
    </div>
  </div>

</div>

<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/chars.js"></script>
<script src="js/sound.js"></script>
<script src="js/net.js"></script>
<script src="js/input.js"></script>
<script src="js/minigames/race.js"></script>
<script src="js/minigames/reflex.js"></script>
<script src="js/minigames/dodge.js"></script>
<script src="js/minigames/memory.js"></script>
<script src="js/minigames/mole.js"></script>
<script src="js/minigames/hotpotato.js"></script>
<script src="js/minigames/filedelete.js"></script>
<script src="js/minigames/wirecut.js"></script>
<script src="js/minigames/shapesort.js"></script>
<script src="js/minigames/puzzle.js"></script>
<script src="js/minigames/floor.js"></script>
<script src="js/minigames/collect.js"></script>
<script src="js/minigames/tersemir.js"></script>
<script src="js/main.js"></script>
</body>
</html>
